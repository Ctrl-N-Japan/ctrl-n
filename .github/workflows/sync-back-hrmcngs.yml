name: Sync main to Back-hrmcngs

on:
  push:
    branches: [main, Back-hrmcngs]
  workflow_dispatch:

permissions:
  contents: write

# Share the lock with the data updater to avoid competing branch writes.
concurrency:
  group: organization-data-and-branch-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync main and regenerate conflicting snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/sync-main.sh Back-hrmcngs --push
