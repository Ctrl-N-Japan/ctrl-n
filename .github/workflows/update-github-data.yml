name: Update public organization data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-github-data.mjs
      - .github/workflows/update-github-data.yml
permissions:
  contents: write
concurrency:
  group: organization-data-and-branch-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-github-data.mjs
      - name: Save updated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/members.json assets/data/repos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public organization data'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN pushes do not trigger another push workflow, so sync directly.
      - name: Keep working branch in sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/sync-main.sh Back-hrmcngs --push
