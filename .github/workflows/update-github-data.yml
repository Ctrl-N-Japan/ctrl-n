name: Update public organization data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-github-data.mjs
      - .github/workflows/update-github-data.yml
permissions:
  contents: write
concurrency:
  group: update-public-organization-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-github-data.mjs
      - name: Save updated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/members.json assets/data/repos.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public organization data'
          git push origin HEAD:main
